<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <!-- Single Crane Official Insignia (단학흉배 單鶴胸背) -->
  <rect width="60" height="60" rx="8" fill="#1b2234" stroke="#94a3b8" stroke-width="2"/>
  <rect x="4" y="4" width="52" height="52" rx="5" fill="none" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3,1"/>

  <!-- Clouds -->
  <path d="M10 16 Q16 10 22 16" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M36 46 Q42 40 48 46" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Wave at bottom -->
  <path d="M14 52 Q22 47 30 51 Q38 47 46 52" fill="none" stroke="#56b6c2" stroke-width="1.5"/>

  <!-- Center Majestic Soaring Crane -->
  <path d="M14 34 Q30 14 46 22 Q38 34 26 38 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.6"/>
  <!-- Crane neck and head -->
  <path d="M30 22 L38 12" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="38" cy="12" r="2.2" fill="#ef4444"/>
  <!-- Black tail tips -->
  <path d="M18 36 L12 44 M22 37 L17 46" stroke="#0f172a" stroke-width="2"/>
  <!-- Legs -->
  <line x1="26" y1="38" x2="22" y2="48" stroke="#cbd5e1" stroke-width="1.2"/>
</svg>
