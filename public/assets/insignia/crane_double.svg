<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60">
  <!-- Double Crane Official Insignia (쌍학흉배 雙鶴胸背) -->
  <rect width="60" height="60" rx="8" fill="#1b2234" stroke="#d4af37" stroke-width="2.5"/>
  <rect x="4" y="4" width="52" height="52" rx="5" fill="none" stroke="#e5c178" stroke-width="1" stroke-dasharray="3,1"/>

  <!-- Golden Clouds (금빛 구름) -->
  <path d="M8 16 Q14 10 20 16 Q24 12 28 16" fill="none" stroke="#e5c178" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M32 46 Q38 40 44 46 Q48 42 52 46" fill="none" stroke="#e5c178" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Wave / Rock base at bottom -->
  <path d="M12 52 Q20 46 30 50 Q40 46 48 52" fill="none" stroke="#56b6c2" stroke-width="1.8"/>

  <!-- Crane 1 (Left, flying upward) -->
  <!-- Wings spread -->
  <path d="M10 36 Q18 22 28 26 Q24 34 16 38 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
  <path d="M18 26 L26 16" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="26" cy="16" r="2" fill="#ef4444"/> <!-- Danjeong red crown -->
  <!-- Tail feathers -->
  <path d="M12 37 L8 44 M15 38 L12 45" stroke="#334155" stroke-width="1.5"/>

  <!-- Crane 2 (Right, soaring) -->
  <path d="M50 24 Q42 38 32 34 Q36 26 44 22 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
  <path d="M42 34 L34 44" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="34" cy="44" r="2" fill="#ef4444"/>
  <!-- Tail feathers -->
  <path d="M48 23 L54 18 M46 22 L51 16" stroke="#334155" stroke-width="1.5"/>
</svg>
