<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Shield Hexagon -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Tactical Grid Diamonds -->
  <polygon points="32,14 44,22 32,30 20,22" fill="none" stroke="#1e3a8a" stroke-width="1.5"/>
  <polygon points="44,24 54,30 44,38 34,32" fill="none" stroke="#1e3a8a" stroke-width="1.5"/>
  <polygon points="20,24 30,32 20,38 10,30" fill="none" stroke="#1e3a8a" stroke-width="1.5"/>
  <polygon points="32,32 44,40 32,48 20,40" fill="none" stroke="#1e3a8a" stroke-width="1.5"/>
  
  <!-- Central Mech Core / Breach Chevron -->
  <polygon points="32,18 42,28 32,38 22,28" fill="url(#coreGrad)" filter="url(#glow)"/>
  <circle cx="32" cy="28" r="4" fill="#ffffff"/>
  
  <!-- Danger Accent Indicators -->
  <circle cx="58" cy="18" r="2.5" fill="#f43f5e"/>
  <circle cx="6" cy="18" r="2.5" fill="#f43f5e"/>
  <circle cx="32" cy="56" r="2.5" fill="#38ef7d"/>
</svg>
